<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Demo Console</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1a1a1a;
      --surface: #2a2a2a;
      --border: #444;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
    }
    h1 {
      margin: 0 0 1rem 0;
      font-size: 1.6rem;
      text-align: center;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
      max-width: 1400px;
      margin: 0 auto;
      height: calc(100vh - 120px);
    }
    .zone {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .zone h2 {
      margin: 0 0 1rem 0;
      font-size: 1.1rem;
      color: var(--text);
    }
    .zone-content {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    .log-area {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .agent-info {
      background-color: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .agent-info-label {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .agent-info-value {
      color: var(--text);
      font-weight: 500;
      margin-top: 0.25rem;
      font-family: 'Courier New', monospace;
    }
    #budget {
      font-size: 1.8rem;
      font-weight: bold;
      color: #4ade80;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 1rem 0;
    }
    .budget-label {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
    }
    .loading {
      color: var(--text-muted);
      font-style: italic;
    }
    .error {
      color: #ef4444;
    }
    .button-group {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    button:active {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #6b7280;
      cursor: not-allowed;
    }
    .status-message {
      padding: 0.75rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }
    .status-info {
      background-color: #164e63;
      color: #06b6d4;
      border: 1px solid #06b6d4;
    }
    .status-success {
      background-color: #064e3b;
      color: #10b981;
      border: 1px solid #10b981;
    }
    .status-neutral {
      background-color: #4b5563;
      color: #cbd5e1;
      border: 1px solid #64748b;
    }
    .status-error {
      background-color: #7f1d1d;
      color: #fca5a5;
      border: 1px solid #ef4444;
    }
    .tool-result {
      background-color: #164e63;
      border: 1px solid #0891b2;
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .tool-result-header {
      color: #06b6d4;
      font-weight: bold;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }
    .tool-result-content {
      color: #cbd5e1;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 200px;
      overflow-y: auto;
    }
    .receipt-section {
      background-color: #1a1a1a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }
    .receipt-row {
      display: flex;
      justify-content: space-between;
      padding: 0.25rem 0;
      color: var(--text);
    }
    .receipt-label {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <h1>Agent Demo Console</h1>

  <div class="container">
    <!-- Agent Zone -->
    <div class="zone" id="zone-agent">
      <h2>Agent</h2>
      <div class="zone-content">
        <div class="agent-info">
          <div class="agent-info-label">Agent ID</div>
          <div class="agent-info-value" id="agent-id">–</div>
        </div>
        <div class="button-group">
          <button id="btn-enroll" onclick="enrollCard()">Enroll card</button>
          <button id="btn-refresh" onclick="refreshEnrollmentStatus()">Refresh status</button>
        </div>
        <div id="enrollment-status"></div>
        <div style="margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted);">
          Log:
        </div>
        <div class="log-area" id="log-agent"></div>
      </div>
    </div>

    <!-- Resource Zone -->
    <div class="zone" id="zone-resource">
      <h2>Resource</h2>
      <div class="zone-content">
        <div class="log-area" id="log-resource"></div>
      </div>
    </div>

    <!-- Money Zone -->
    <div class="zone" id="zone-money">
      <h2>Money</h2>
      <div class="zone-content">
        <div class="button-group">
          <button id="btn-run-report" onclick="runMarketReport()">Run market report</button>
          <button id="btn-buy-quote" onclick="buyQuote()" style="display: none;">Buy Quote</button>
        </div>
        <div class="budget-label">Budget</div>
        <div id="budget">–</div>
        <div id="receipt-display"></div>
        <div class="log-area" id="log-money"></div>
      </div>
    </div>
  </div>

  <script>
    // Module-level state holding agent bootstrap response
    let agent = {
      agentId: null,
      apiKey: null,
      hmacSecret: null,
      budgetCents: null
    };

    // Module-level state holding the last signature header for retries
    let lastSignatureHeader = null;

    /**
     * Append a timestamped message to a zone's log area
     */
    function log(zone, msg) {
      const logId = `log-${zone}`;
      const logElement = document.getElementById(logId);
      if (!logElement) return;

      const now = new Date().toLocaleTimeString();
      const line = `[${now}] ${msg}\n`;
      logElement.textContent += line;
      logElement.scrollTop = logElement.scrollHeight;
    }

    /**
     * Format cents as USD currency string
     */
    function formatMoney(cents) {
      return `$${(cents / 100).toFixed(2)}`;
    }

    /**
     * Truncate agentId for display (show first 8 chars + ellipsis)
     */
    function displayAgentId(id) {
      if (!id) return '–';
      return id.length > 10 ? id.substring(0, 10) + '…' : id;
    }

    /**
     * Enroll a card by calling POST /v1/enrollments with Bearer auth
     */
    async function enrollCard() {
      if (!agent.apiKey) {
        log('agent', 'Error: Agent not bootstrapped yet');
        return;
      }

      try {
        log('agent', 'Enrolling card...');

        const response = await fetch('/v1/enrollments', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${agent.apiKey}`
          },
          body: JSON.stringify({ sourceType: 'CARD' })
        });

        if (!response.ok) {
          const text = await response.text();
          log('agent', `Error: ${response.status} ${text}`);
          return;
        }

        const data = await response.json();
        log('agent', `Enrollment created: ${data.enrollmentId}`);
        log('agent', `Opening CardFields page in new tab...`);
        log('agent', `Please enter the PayPal test card on the hosted page.`);

        // Open the enrollment URL in a new tab
        window.open(data.enrollmentUrl, '_blank');

      } catch (error) {
        log('agent', `Error: ${error.message}`);
      }
    }

    /**
     * Refresh enrollment status by calling GET /v1/enrollments with Bearer auth
     */
    async function refreshEnrollmentStatus() {
      if (!agent.apiKey) {
        log('agent', 'Error: Agent not bootstrapped yet');
        return;
      }

      try {
        log('agent', 'Checking enrollment status...');

        const response = await fetch('/v1/enrollments', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${agent.apiKey}`
          }
        });

        if (!response.ok) {
          const text = await response.text();
          log('agent', `Error: ${response.status} ${text}`);
          return;
        }

        const enrollments = await response.json();
        const statusElement = document.getElementById('enrollment-status');

        // Check if there's an active card enrollment
        const activeCard = enrollments.find(e =>
          e.status === 'ACTIVE' && e.sourceType === 'CARD'
        );

        if (!activeCard) {
          // No active card enrollment
          statusElement.className = 'status-message status-neutral';
          statusElement.textContent = 'No active card — enroll first';
          log('agent', 'No active card enrollment found');
        } else {
          // Active card found
          const cardDisplay = `${activeCard.brand} •••• ${activeCard.last4}`;
          statusElement.className = 'status-message status-success';
          statusElement.textContent = `✓ Active card: ${cardDisplay}`;
          log('agent', `Active card: ${cardDisplay}`);
        }

      } catch (error) {
        log('agent', `Error: ${error.message}`);
      }
    }

    /**
     * Convert string to UTF-8 bytes
     */
    function utf8(str) {
      return new TextEncoder().encode(str);
    }

    /**
     * Compute HMAC-SHA256 and return base64url without padding
     */
    async function hmacBase64Url(secret, canonical) {
      // Import the key
      const key = await crypto.subtle.importKey(
        'raw',
        utf8(secret),
        { name: 'HMAC', hash: 'SHA-256' },
        false,
        ['sign']
      );

      // Sign the canonical string
      const signature = await crypto.subtle.sign('HMAC', key, utf8(canonical));

      // Convert to base64url (no padding)
      const bytes = new Uint8Array(signature);
      let binary = '';
      for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      const base64 = btoa(binary);
      // Replace + with -, / with _, and remove padding =
      return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    /**
     * Run market report: call buyQuote and render the result
     */
    async function runMarketReport() {
      const result = await buyQuote();

      if (!result) {
        log('money', 'Error: buyQuote returned null');
        return;
      }

      const receiptDisplay = document.getElementById('receipt-display');
      receiptDisplay.innerHTML = '';

      // Handle success (200)
      if (result.status === 200) {
        log('money', 'Rendering successful payment...');

        // Render content in resource zone
        if (result.body) {
          const resourceLog = document.getElementById('log-resource');
          resourceLog.innerHTML = '';

          // Add AlphaSignal tool result header
          const toolResult = document.createElement('div');
          toolResult.className = 'tool-result';
          toolResult.innerHTML = `
            <div class="tool-result-header">✓ AlphaSignal Tool Result</div>
            <div class="tool-result-content">${escapeHtml(JSON.stringify(result.body, null, 2))}</div>
          `;
          resourceLog.appendChild(toolResult);
        }

        // Decode and render receipt
        if (result.receiptHeader) {
          try {
            const decoded = atob(result.receiptHeader);
            const receipt = JSON.parse(decoded);

            // Update budget (decrement by $1.00 = 100 cents)
            if (agent.budgetCents !== null) {
              agent.budgetCents -= 100;
              const budgetElement = document.getElementById('budget');
              budgetElement.textContent = formatMoney(agent.budgetCents);
              log('money', `Budget updated: ${formatMoney(agent.budgetCents)}`);
            }

            // Render receipt in money zone
            const receiptSection = document.createElement('div');
            receiptSection.className = 'receipt-section';

            // Transaction info
            if (receipt.transaction) {
              receiptSection.innerHTML += `
                <div class="receipt-row">
                  <span class="receipt-label">Transaction:</span>
                  <span>${escapeHtml(receipt.transaction)}</span>
                </div>
              `;
            }

            // Order ID
            if (receipt.extra && receipt.extra.orderId) {
              receiptSection.innerHTML += `
                <div class="receipt-row">
                  <span class="receipt-label">Order ID:</span>
                  <span>${escapeHtml(receipt.extra.orderId)}</span>
                </div>
              `;
            }

            // Capture ID
            if (receipt.extra && receipt.extra.captureId) {
              receiptSection.innerHTML += `
                <div class="receipt-row">
                  <span class="receipt-label">Capture ID:</span>
                  <span>${escapeHtml(receipt.extra.captureId)}</span>
                </div>
              `;
            }

            // Amount breakdown
            if (receipt.extra) {
              if (receipt.extra.gross !== undefined) {
                receiptSection.innerHTML += `
                  <div class="receipt-row">
                    <span class="receipt-label">Gross:</span>
                    <span>$${Number(receipt.extra.gross).toFixed(2)}</span>
                  </div>
                `;
              }
              if (receipt.extra.fee !== undefined) {
                receiptSection.innerHTML += `
                  <div class="receipt-row">
                    <span class="receipt-label">Fee:</span>
                    <span>$${Number(receipt.extra.fee).toFixed(2)}</span>
                  </div>
                `;
              }
              if (receipt.extra.net !== undefined) {
                receiptSection.innerHTML += `
                  <div class="receipt-row">
                    <span class="receipt-label">Net:</span>
                    <span>$${Number(receipt.extra.net).toFixed(2)}</span>
                  </div>
                `;
              }
              if (receipt.extra.status !== undefined) {
                receiptSection.innerHTML += `
                  <div class="receipt-row">
                    <span class="receipt-label">Status:</span>
                    <span>${escapeHtml(receipt.extra.status)}</span>
                  </div>
                `;
              }
            }

            receiptDisplay.appendChild(receiptSection);
            log('money', 'Receipt rendered');

          } catch (e) {
            log('money', `Error parsing receipt: ${e.message}`);
          }
        }

      } else if (result.status === 402) {
        // Handle error (402)
        log('money', 'Rendering payment error...');

        const body = result.body || {};
        const errorCode = body.errorCode || body.code || 'UNKNOWN_ERROR';
        const errorMessage = body.message || body.errorMessage || 'Payment declined';

        // Render error in resource zone
        const resourceLog = document.getElementById('log-resource');
        resourceLog.innerHTML = '';

        const errorResult = document.createElement('div');
        errorResult.className = 'status-message status-error';
        errorResult.style.fontSize = '1rem';
        errorResult.style.padding = '1rem';
        errorResult.innerHTML = `
          <div style="font-weight: bold; margin-bottom: 0.5rem;">✗ Payment Failed</div>
          <div style="margin-bottom: 0.5rem;"><strong>Code:</strong> ${escapeHtml(errorCode)}</div>
          <div><strong>Message:</strong> ${escapeHtml(errorMessage)}</div>
        `;
        resourceLog.appendChild(errorResult);

        // Render error in money zone
        const receiptSection = document.createElement('div');
        receiptSection.className = 'status-message status-error';
        receiptSection.style.marginBottom = '0.75rem';
        receiptSection.innerHTML = `
          <div style="font-weight: bold;">✗ ${escapeHtml(errorCode)}</div>
          <div style="margin-top: 0.25rem; font-size: 0.9rem;">${escapeHtml(errorMessage)}</div>
        `;
        receiptDisplay.appendChild(receiptSection);

        log('money', `Error rendered: ${errorCode}`);

      } else {
        // Unexpected status
        log('money', `Unexpected status: ${result.status}`);
        const errorSection = document.createElement('div');
        errorSection.className = 'status-message status-error';
        errorSection.innerHTML = `
          <div style="font-weight: bold;">✗ Unexpected Response</div>
          <div style="margin-top: 0.25rem; font-size: 0.9rem;">Status: ${result.status}</div>
        `;
        receiptDisplay.appendChild(errorSection);
      }
    }

    /**
     * HTML escape utility
     */
    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    /**
     * Perform x402 sign-and-pay flow for /v1/premium/quote
     * Step 1: GET without signature, expect 402 + PAYMENT-REQUIRED header
     * Step 2: Extract challenge and check enrollment
     * Step 3: Build canonical string and sign with HMAC-SHA256
     * Step 4: GET with PAYMENT-SIGNATURE header
     */
    async function buyQuote() {
      if (!agent.apiKey || !agent.hmacSecret || !agent.agentId) {
        log('agent', 'Error: Agent not bootstrapped yet');
        return null;
      }

      try {
        log('money', 'Initiating buyQuote...');

        // Step 1: First leg - GET without signature, expect 402
        log('money', 'Fetching /v1/premium/quote (unauthenticated attempt)...');
        const firstResponse = await fetch('/v1/premium/quote', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${agent.apiKey}`
          }
        });

        log('money', `Response: ${firstResponse.status}`);

        if (firstResponse.status !== 402) {
          log('money', `Expected 402, got ${firstResponse.status}`);
          const text = await firstResponse.text();
          log('money', `Body: ${text}`);
          return null;
        }

        // Read PAYMENT-REQUIRED header
        const paymentRequiredHeader = firstResponse.headers.get('PAYMENT-REQUIRED');
        if (!paymentRequiredHeader) {
          log('money', 'Error: No PAYMENT-REQUIRED header in 402 response');
          return null;
        }

        // Decode the header (base64 -> JSON)
        let required;
        try {
          const decoded = atob(paymentRequiredHeader);
          required = JSON.parse(decoded);
        } catch (e) {
          log('money', `Error decoding PAYMENT-REQUIRED header: ${e.message}`);
          return null;
        }

        log('money', 'Challenge received');

        // Step 2: Extract accept and check enrollment
        const accepts = required.accepts;
        if (!accepts || accepts.length === 0) {
          log('money', 'Error: No payment options offered');
          return null;
        }

        const accept = accepts[0];
        const enrolled = accept.extra && accept.extra.enrolled === true;

        if (!enrolled) {
          log('agent', 'Enroll first');
          log('money', 'Enrollment required - stopping');
          return null;
        }

        // Step 3: Extract fields and build canonical string
        const challengeId = accept.extra.challengeId;
        const nonce = accept.extra.nonce;
        const resource = required.resource.url;
        const amount = accept.amount;
        const asset = accept.asset;
        const timestamp = Math.floor(Date.now() / 1000);

        log('money', `Challenge ID: ${challengeId}`);
        log('money', `Timestamp: ${timestamp}`);

        // Build canonical string exactly as DemoAgent does
        const canonical = [challengeId, 'GET', resource, amount, asset, nonce, String(timestamp)].join('\n');
        log('money', `Canonical string built (${canonical.length} bytes)`);

        // Sign with HMAC-SHA256
        const signature = await hmacBase64Url(agent.hmacSecret, canonical);
        log('money', `Signature computed: ${signature.substring(0, 20)}...`);

        // Step 4: Build payload exactly as DemoAgent does
        const payload = {
          x402Version: 2,
          accepted: accept,
          payload: {
            agentId: agent.agentId,
            challengeId: challengeId,
            nonce: nonce,
            timestamp: timestamp,
            signature: signature
          }
        };

        // Encode payload as base64 (utf-8 safe)
        const payloadJson = JSON.stringify(payload);
        const payloadBytes = new TextEncoder().encode(payloadJson);
        let binary = '';
        for (let i = 0; i < payloadBytes.length; i++) {
          binary += String.fromCharCode(payloadBytes[i]);
        }
        lastSignatureHeader = btoa(binary);
        log('money', `Signature header prepared: ${lastSignatureHeader.substring(0, 20)}...`);

        // Step 5: Second leg - GET with PAYMENT-SIGNATURE header
        log('money', 'Retrying with PAYMENT-SIGNATURE header...');
        const paidResponse = await fetch('/v1/premium/quote', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${agent.apiKey}`,
            'PAYMENT-SIGNATURE': lastSignatureHeader
          }
        });

        log('money', `Response: ${paidResponse.status}`);

        // Check for receipt header
        const receiptHeader = paidResponse.headers.get('PAYMENT-RESPONSE');
        if (receiptHeader) {
          try {
            const decoded = atob(receiptHeader);
            const receipt = JSON.parse(decoded);
            log('money', `Receipt: ${JSON.stringify(receipt).substring(0, 100)}...`);
          } catch (e) {
            log('money', `Receipt header (raw): ${receiptHeader.substring(0, 50)}...`);
          }
        }

        // Check for replay header
        const replayHeader = paidResponse.headers.get('X-X402-Replay');
        if (replayHeader) {
          log('money', `Replay header: ${replayHeader}`);
        }

        // Log body based on status
        let responseBody = null;
        if (paidResponse.status === 200) {
          log('money', 'SUCCESS: Payment accepted (200)');
          responseBody = await paidResponse.json();
          log('money', `Quote: ${JSON.stringify(responseBody).substring(0, 100)}...`);
        } else if (paidResponse.status === 402) {
          responseBody = await paidResponse.json();
          const errorCode = responseBody.errorCode || responseBody.code || 'unknown';
          log('money', `Payment declined: ${errorCode}`);
          log('money', `Message: ${responseBody.message || responseBody.errorMessage || responseBody.body || ''}`);
        } else {
          const text = await paidResponse.text();
          log('money', `Response body: ${text.substring(0, 100)}`);
          responseBody = { text };
        }

        return {
          status: paidResponse.status,
          body: responseBody,
          receiptHeader: receiptHeader,
          replayHeader: replayHeader
        };

      } catch (error) {
        log('money', `Error: ${error.message}`);
        return null;
      }
    }

    async function bootstrap() {
      try {
        log('agent', 'Bootstrapping demo agent...');

        const response = await fetch('/v1/agents', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'Demo Agent', budgetCents: 10000 })
        });

        if (!response.ok) {
          const text = await response.text();
          log('agent', `Error: ${response.status} ${text}`);
          return;
        }

        const data = await response.json();
        agent = {
          agentId: data.agentId,
          apiKey: data.apiKey,
          hmacSecret: data.hmacSecret,
          budgetCents: data.budgetCents
        };

        // Render agent ID
        const agentIdElement = document.getElementById('agent-id');
        agentIdElement.textContent = displayAgentId(agent.agentId);

        // Render budget
        const budgetElement = document.getElementById('budget');
        budgetElement.textContent = formatMoney(agent.budgetCents);

        log('agent', `Agent ${displayAgentId(agent.agentId)} created`);
        log('agent', `Budget: ${formatMoney(agent.budgetCents)}`);

      } catch (error) {
        log('agent', `Error: ${error.message}`);
      }
    }

    // Start bootstrap on DOMContentLoaded
    document.addEventListener('DOMContentLoaded', bootstrap);
  </script>
</body>
</html>
